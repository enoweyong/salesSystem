AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "NovaShop serverless backend — Amazon Cognito (auth), API Gateway (REST),\
  \ Lambda (CRUDL), DynamoDB (products & orders), S3 (product images).\n"
Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues:
    - dev
    - staging
    - prod
    Description: API Gateway stage name.
  UserPoolDomainPrefix:
    Type: String
    Default: novashop-sales-demo
    Description: Globally unique Cognito hosted-UI domain prefix (change to 
      something unique).
Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 10
    Architectures:
    - x86_64
    Environment:
      Variables:
        PRODUCTS_TABLE:
          Ref: ProductsTable
        ORDERS_TABLE:
          Ref: OrdersTable
        IMAGES_BUCKET:
          Ref: ImagesBucket
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: novashop-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailMessage: Welcome to NovaShop! Your username is {username} and 
            temporary password is {####}.
          EmailSubject: Your NovaShop account
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Ref: UserPoolDomainPrefix
      UserPoolId:
        Ref: UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: novashop-web
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
      - COGNITO
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: novashop-api
      StageName:
        Ref: StageName
      Cors:
        AllowMethods: "'DELETE,GET,OPTIONS,PATCH,POST,PUT'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: productId
        AttributeType: S
      KeySchema:
      - AttributeName: productId
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: orderId
        AttributeType: S
      - AttributeName: userId
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      KeySchema:
      - AttributeName: orderId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: user-createdAt-index
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
        - AllowedMethods:
          - PUT
          - GET
          AllowedOrigins:
          - '*'
          AllowedHeaders:
          - '*'
          MaxAge: 3000
  ProductsFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-products-crudl
      CodeUri: 
        s3://novashop-deploy-793593623274-us-east-1/lambda/f1fda8b598cce5e14c8896b2aa49bcff
      Handler: src/handlers/products.handler
      Description: Create/Read/Update/Delete/List products (DynamoDB + S3 
        images)
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      - S3CrudPolicy:
          BucketName:
            Ref: ImagesBucket
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /products
            Method: get
        CreateProduct:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /products
            Method: post
        GetProduct:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /products/{id}
            Method: get
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /products/{id}
            Method: put
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /products/{id}
            Method: delete
  OrdersFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-orders
      CodeUri: 
        s3://novashop-deploy-793593623274-us-east-1/lambda/f1fda8b598cce5e14c8896b2aa49bcff
      Handler: src/handlers/orders.handler
      Description: Create & list orders; atomically decrements stock (DynamoDB 
        transactions)
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: OrdersTable
      Events:
        ListOrders:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /orders
            Method: get
        CreateOrder:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /orders
            Method: post
  PresignFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-presign
      CodeUri: 
        s3://novashop-deploy-793593623274-us-east-1/lambda/f1fda8b598cce5e14c8896b2aa49bcff
      Handler: src/handlers/presign.handler
      Description: Returns pre-signed S3 PUT URLs for product image uploads
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: ImagesBucket
      Events:
        PresignImage:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /images/presign
            Method: post
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL (set as apiBaseUrl in frontend/config.js)
    Value:
      Fn::Sub: 
        https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  UserPoolId:
    Description: Cognito User Pool ID (set as userPoolId in frontend/config.js)
    Value:
      Ref: UserPool
  UserPoolClientId:
    Description: Cognito App Client ID (set as clientId in frontend/config.js)
    Value:
      Ref: UserPoolClient
  ImagesBucketName:
    Description: S3 bucket that stores product images
    Value:
      Ref: ImagesBucket
  Region:
    Value:
      Ref: AWS::Region
